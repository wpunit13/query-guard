# Policy for the Docker Compose harness. The upstream points at the Trino
# container by its compose service name (trino) on the shared network.
server:
  port: 8090
  read_timeout: 30s
  write_timeout: 5m
  shutdown_grace_period: 10s

upstream:
  url: http://trino:8080
  timeout: 30s

preflight:
  timeout: 2s
  max_concurrent: 5

rules:
  table_blocklist:
    - lineitem

  # v1 feature verification
  function_blocklist:
    - regexp_count

  select_star_blocked_tables:
    - customer

  required_filters:
    - catalog: tpch
      schema: tiny
      table: orders
      mode: any-of
      columns: [orderdate, shippriority]

  cost_limits:
    - catalog: tpch
      schema: tiny
      table: orders
      max_scan_bytes: 500000
      max_rows: 0
    - max_scan_bytes_per_query: 8000000
      max_cpu_cost_per_query: 500000

audit:
  log_rejections: true
  snapshot_plan: true

telemetry:
  enabled: true
  path: /metrics