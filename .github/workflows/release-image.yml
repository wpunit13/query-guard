# Publish the query-guard container image to GHCR.
#
# Triggered by pushing a semver release tag (v*.*.*). Uses the built-in
# GITHUB_TOKEN — no registry credentials to configure. The first push
# creates the ghcr.io/<owner>/query-guard package linked to this repo;
# flip its visibility to public once in package settings for OSS pulls.
#
# Tags produced for v1.2.3:
#   ghcr.io/<owner>/query-guard:v1.2.3
#   ghcr.io/<owner>/query-guard:1.2
#   ghcr.io/<owner>/query-guard:1
#   ghcr.io/<owner>/query-guard:latest
#   ghcr.io/<owner>/query-guard:sha-<commit>

name: Release image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (CI token — no secrets to configure)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
