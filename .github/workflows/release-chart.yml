# Publish the query-guard Helm chart to GHCR as an OCI artifact.
#
# Triggered by pushing a semver release tag (v*.*.*), alongside the image
# release workflow. The chart version/appVersion are stamped from the git
# tag at package time, so Chart.yaml does not need bumping per release.
#
# Consumers install with:
#   helm pull oci://ghcr.io/<owner>/query-guard/chart --version 1.2.3
#
# Uses the built-in GITHUB_TOKEN — no credentials to configure.

name: Release chart

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Package & push chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Log in to GHCR (CI token — no secrets to configure)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive chart version from tag
        id: ver
        run: |
          # v1.2.3-rc1 -> 1.2.3-rc1 (strip the leading v)
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint deploy/helm/

      - name: Package chart (version stamped from tag)
        run: |
          mkdir -p .chart-package
          helm package deploy/helm/ \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination .chart-package

      - name: Push chart to GHCR OCI
        run: |
          helm push .chart-package/query-guard-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/query-guard/chart"
